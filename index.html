<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Bangers&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <title>GTA VI</title>
</head>

<body>

    <p class="nome">Lucia</p>
    <img class="personagem" src="img/lucia.png" alt="Lucia">

    <section class="textos">
        <p class="etiqueta">Selecione o seu Personagem</p>
        <h1>Não é só <br> um Jogo</h1>
        <p class="texto-apoio">Escolha uma lenda de Dev City. Ou tire uma selfie e vire uma.</p>
    </section>

    <section class="menu">

        <img onclick="escolherPersonagem('Lucia', 'img/lucia.png', '#ff3cac')" class="avatar efeito-cursor"
            src="img/lucia.png">

        <img onclick="escolherPersonagem('Jason', 'img/jason.png', '#00b2c9')" class="avatar efeito-cursor"
            src="img/jason.png">

        <img onclick="escolherPersonagem('Cj', 'img/cj.png', '#7ed37e')" class="avatar efeito-cursor" src="img/cj.png">

        <label class="voce efeito-cursor">📷
            <input type="file" accept="image/*" hidden onchange="lerFoto(this)">
        </label>

    </section>
</body>

<script src=" https://js.puter.com/v2/ "></script>
<script src="scripts.js"></script>

</html>
